<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="2;url=https://magical.enterprises">
  <title>Magical Industries</title>
  <meta name="description" content="Redirecting to Magical Enterprises">
  <link rel="icon" href="{{ "img/favicon.ico" | absURL }}">
  <link rel="canonical" href="https://magical.enterprises">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #666;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f10;
        --fg: #f2f2f2;
        --muted: #9a9a9a;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      text-align: center;
      padding: 2rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 28rem;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 16px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    a:hover {
      opacity: 0.8;
    }
  </style>
  <script>
    // Brief delay so logo + message are visible; meta refresh is a fallback
    setTimeout(function () {
      window.location.replace("https://magical.enterprises");
    }, 1500);
  </script>
</head>
<body>
  <main class="card">
    <img class="logo" src="{{ "img/Logo1.png" | absURL }}" alt="Magical Industries logo" width="120" height="120">
    <h1>Magical Industries</h1>
    <p>
      Redirecting to Magical Enterprises...
      <br>
      <a href="https://magical.enterprises">Continue if you are not redirected</a>
    </p>
  </main>
</body>
</html>
